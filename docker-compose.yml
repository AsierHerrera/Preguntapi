version: '3'
services:
  mongo:
    image: mongo:latest
    container_name: mongo-user
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - ${DB_PORT}:27017
    volumes:
      - mongo_qtre:/data/db
    networks:
      - preguntapi
  nginx:
    image: nginx:latest
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=preguntapi.asierherrera.com
      - LETSENCRYPT_HOST=preguntapi.asierherrera.com
      - LETSENCRYPT_EMAIL=asierherrera97@gmail.com
    volumes:
      - ./html:/usr/share/nginx/html:ro
      ##En caso de que tenga rutass variables o se quiera configurar nginx##
      #- ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-proxy
    restart: unless-stopped
  backend:
    build: .
    container_name: ${APP_HOST}
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=preguntapi-api.asierherrera.com
      - LETSENCRYPT_HOST=preguntapi-api.asierherrera.com
      - LETSENCRYPT_EMAIL=asierherrera97@gmail.com
      - ./src:/app/src
      - /node_modules
    networks:
      - preguntapi
      - nginx-proxy
networks:
  nginx-proxy:
    name: nginx-proxy
    external: true
  preguntapi:
    name: preguntapi
    external: true